<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your own art</title>
    <link rel="stylesheet" href="index.css">
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="index.js" defer></script>
</head>
<body>

    <!-- environment -->

    <div id="scene">

        <img id="background" src="DIY/images/wallpaper.webp">

        <img id="floor" src="DIY/images/floor.png">

        <img id="light" src="DIY/images/light1.png">

        <-- interactive objects -->

<img id="pillar" src="DIY/images/pillar.png">

<img id="pillar2" src="DIY/images/pillar2.png">

<img id="easel" src="DIY/images/easel.png">

<a href="gallery/gallery.html">
    <img id="easel.2" src="DIY/images/easel 2.png">
</a>

<img id="table" src="DIY/images/table.png">

<!-- darkness overlay -->

<div id="darkness"></div>

        <!-- hover text -->

        <p id="hover-text"></p>

        <!-- opening dialogue -->

        <div id="introduction">

            <h1 id="welcome">Welcome to the Craft Area!</h1>

            <h2>Choose your medium!</h2>

        </div>

        <div id="environment-output"></div>

</body>
</html>
