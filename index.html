<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Image Gallery</title>
  <link rel="stylesheet" href="index.css">
</head>

<h1> Welcome to the Art Gallery </h1>

<body>

  <div class="slider-container">
    <div class="slider-track" id="track">
      <img src="images/eytan1.jpg" alt="Gallery image 1">
      <img src="images/eytan2.jpg" alt="Gallery image 2">
      <img src="images/eytan3.jpg" alt="Gallery image 3">
      <img src="images/eytan4.jpg" alt="gallery image 4">
      
    </div>
    
    <button class="btn prev" onclick="moveSlide(-1)">&#10094;</button>
    <button class="btn next" onclick="moveSlide(1)">&#10095;</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
